# Publish calb-qwenpaw to PyPI from the shangeyao fork ONLY.
# Repository: https://github.com/shangeyao/QwenPaw
# NOT agentscope-ai/QwenPaw.
#
# Pipeline: build → verify (pip install + boot) → publish.
#
# PyPI Trusted Publishing (https://pypi.org/manage/account/publishing/):
#   Project: calb-qwenpaw
#   Owner: shangeyao
#   Repository name: QwenPaw
#   Owner: shangeyao
#   Workflow: publish-pypi.yml
#   Environment: pypi
#
# Or set PYPI_API_TOKEN in https://github.com/shangeyao/QwenPaw/settings/secrets

name: Publish Python Package to PyPI

on:
  workflow_dispatch:
    inputs:
      force_push_to_pypi:
        description: "Force push to PyPI (even without release)"
        required: false
        type: boolean
        default: false
      yank_version:
        description: "Yank this PyPI version before publish (optional)"
        required: false
        type: string
        default: ""
  # NOTE: legacy fallback path. The standard release flow is now release.yml
  # (see RELEASING.md). Publishing a GitHub Release directly still triggers this
  # OLD publish, which is NOT gated on the desktop build. Kept only as an
  # emergency rollback until the old release workflows are removed.
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node (for console build)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json

      - name: Build console frontend
        run: |
          cd console && npm ci && npx vite build

      - name: Copy console build into package
        run: |
          rm -rf src/qwenpaw/console/*
          mkdir -p src/qwenpaw/console
          cp -R console/dist/* src/qwenpaw/console/

      - name: Bundle docs into package
        run: |
          rm -rf src/qwenpaw/docs
          mkdir -p src/qwenpaw/docs
          cp website/public/docs/*.md src/qwenpaw/docs/

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel build

      - name: Build package
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qwenpaw-dist
          path: dist/
          retention-days: 30

      - name: Upload version metadata
        uses: actions/upload-artifact@v4
        with:
          name: qwenpaw-version
          path: src/qwenpaw/__version__.py
          retention-days: 30

  verify:
    needs: [build]
    uses: ./.github/workflows/release-verify.yml
    with:
      verify_pip: true
      verify_script_install: false

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_push_to_pypi == 'true')
    environment:
      name: pypi
      url: https://pypi.org/p/calb-qwenpaw
    steps:
      - name: Set up Python
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.yank_version != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Yank previous PyPI release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.yank_version != ''
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request

          package = "calb-qwenpaw"
          version = os.environ["YANK_VERSION"]
          token = os.environ["PYPI_API_TOKEN"]
          payload = json.dumps(
              {
                  "yanked": True,
                  "yanked_reason": (
                      "Yanked for republish with latest fork changes"
                  ),
              },
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://pypi.org/api/projects/{package}/{version}",
              data=payload,
              headers={
                  "Authorization": "Basic "
                  + base64.b64encode(f"__token__:{token}".encode()).decode(),
                  "Content-Type": "application/json",
              },
              method="PATCH",
          )
          try:
              with urllib.request.urlopen(request) as response:
                  print(response.read().decode("utf-8", errors="replace"))
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              lowered = body.lower()
              if exc.code == 404:
                  print(f"Version {version} not found on PyPI; continuing.")
              elif "already yanked" in lowered:
                  print(f"Version {version} already yanked; continuing.")
              else:
                  print(body)
                  raise
          PY
        env:
          YANK_VERSION: ${{ github.event.inputs.yank_version }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: qwenpaw-dist
          path: dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
